<!doctype html><html lang="pt"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casa</title>
<style>
:root{--paper:#f4f1ec;--ink:#1c1e1a;--soft:#5b6058;--line:#ddd8cf;--card:#fffdfa;
 --accent:#3f6b4b;--accent-s:#e8efe7;--warn:#a8501f;--warn-s:#f7ebe3;--gold:#8a6d1f;
 --sh:0 1px 2px rgba(30,35,25,.06),0 6px 18px rgba(30,35,25,.05)}
@media(prefers-color-scheme:dark){:root{--paper:#14170f;--ink:#eae7df;--soft:#9aa093;
 --line:#2b2f26;--card:#1b1f17;--accent:#7fb489;--accent-s:#1f2a20;--warn:#e0946a;
 --warn-s:#2e211a;--gold:#c8a94a;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3)}}
:root[data-theme=dark]{--paper:#14170f;--ink:#eae7df;--soft:#9aa093;--line:#2b2f26;
 --card:#1b1f17;--accent:#7fb489;--accent-s:#1f2a20;--warn:#e0946a;--warn-s:#2e211a;
 --gold:#c8a94a;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3)}
:root[data-theme=light]{--paper:#f4f1ec;--ink:#1c1e1a;--soft:#5b6058;--line:#ddd8cf;
 --card:#fffdfa;--accent:#3f6b4b;--accent-s:#e8efe7;--warn:#a8501f;--warn-s:#f7ebe3;
 --gold:#8a6d1f;--sh:0 1px 2px rgba(30,35,25,.06),0 6px 18px rgba(30,35,25,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px 15px 70px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;
 padding-bottom:12px;border-bottom:2px solid var(--ink)}
h1{font:600 25px/1.1 Georgia,serif;margin:0}
.sub{color:var(--soft);font-size:14px}.sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);
 color:var(--ink);border-radius:999px;padding:6px 14px}
button.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.who{font-weight:600;color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:12px 0;
 position:sticky;top:0;background:var(--paper);z-index:5;border-bottom:1px solid var(--line)}
select#sort{font:inherit;font-size:14px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);max-width:100%}
.nota{margin-left:8px;font:600 12.5px/1 -apple-system,sans-serif;padding:4px 8px;border-radius:999px;background:var(--accent-s);color:var(--accent);font-variant-numeric:tabular-nums}
.nota.thin{background:transparent;border:1px solid var(--line);color:var(--soft)}
input[type=search]{font:inherit;padding:7px 12px;border:1px solid var(--line);
 border-radius:999px;background:var(--card);color:var(--ink);flex:1;min-width:160px}
.count{color:var(--soft);font-size:14px;padding:12px 0 6px}
#mapbox{display:none;height:68vh;min-height:340px;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0 4px;background:var(--card)}
#mapbox.on{display:block}
.leaflet-popup-content{margin:11px 13px;font:14px/1.45 -apple-system,sans-serif}
.pp b{font-size:15px}
.pp a{color:var(--accent);text-decoration:none;display:inline-block;margin-top:5px}
.pp .m{color:#666;font-size:12.5px}
.links{display:flex;gap:8px;padding:2px 0 4px;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{flex:0 0 auto;text-decoration:none;font-size:13.5px;white-space:nowrap;
 color:var(--accent);background:var(--card);border:1px solid var(--line);
 border-radius:999px;padding:7px 14px}
.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:15px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.card.flag{border-left:4px solid var(--warn)}
.top{display:flex;align-items:baseline;gap:9px}
.price{font:600 22px/1 Georgia,serif}
.ref{margin-left:auto;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.place b{font-weight:600}.place span{color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
 border-block:1px solid var(--line);padding:10px 0}
.stat{text-align:center}
.stat .v{font:600 16px/1.1 Georgia,serif;font-variant-numeric:tabular-nums}
.stat .v.dim{color:var(--soft);font-weight:400}
.stat .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-s);color:var(--accent)}
.tag.bad{background:var(--warn-s);color:var(--warn);font-weight:600}
.tag.rooms{background:transparent;border:1px solid var(--line);color:var(--soft)}
.exc{font-size:13px;color:var(--soft)}
.acts{display:flex;gap:7px}
.acts a{flex:1;text-align:center;text-decoration:none;font-size:14px;padding:8px;
 border-radius:9px;border:1px solid var(--line);color:var(--ink)}
.acts a.pri{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
.notes{border-top:1px dashed var(--line);padding-top:9px;display:flex;flex-direction:column;gap:7px}
.note{font-size:13.5px;background:var(--accent-s);border-radius:9px;padding:7px 10px}
.note.other{background:transparent;border:1px solid var(--line)}
.note b{color:var(--accent)}.note .t{color:var(--soft);font-size:11px;margin-left:5px}
textarea{font:inherit;width:100%;min-height:52px;padding:8px 10px;border-radius:9px;
 border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}
.tiers{display:flex;gap:5px;align-items:center}
.tiers button{padding:4px 11px;font-size:14px}
.tiers button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.st{display:flex;flex-wrap:wrap;gap:5px}
.st button{padding:4px 10px;font-size:12.5px}
.visit{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.visit .vl{font-size:12px;color:var(--soft)}
.visit input{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:8px;
 border:1px solid var(--line);background:var(--paper);color:var(--ink);flex:1;min-width:150px}
.visit .clr{padding:5px 11px;font-size:13px}
#rota{margin:10px 0 0}
.day{background:var(--card);border:1px solid var(--line);border-radius:13px;
 box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.dh{background:var(--accent-s);color:var(--accent);font-weight:600;padding:11px 14px;
 font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mapsbtn{margin-left:auto;font-size:13px;text-decoration:none;background:var(--accent);
 color:var(--paper);padding:6px 13px;border-radius:999px}
.stop{padding:11px 14px;border-top:1px solid var(--line);font-size:14.5px}
.stop b{font-variant-numeric:tabular-nums;margin-right:8px}
.stop .pl{font-weight:600}
.stop .pr{color:var(--soft);font-size:13.5px;margin-left:8px}
.stop a{text-decoration:none;color:var(--accent);font-size:18px;margin-left:8px}
.stop .leg{font-size:12.5px;color:var(--soft);margin-top:4px}
.stop.tight{background:var(--warn-s)}
.stop.tight .leg{color:var(--warn);font-weight:600}
.gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
 justify-content:center;z-index:50}
.gate .box{text-align:center;padding:30px}
.gate h2{font:600 24px/1.2 Georgia,serif;margin:0 0 6px}
.gate p{color:var(--soft);margin:0 0 22px}
.gate button{font-size:18px;padding:13px 34px;margin:0 6px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:9px 17px;
 border-radius:9px;color:#fff;background:var(--accent);opacity:0;transition:opacity .3s;
 pointer-events:none;z-index:60;font-size:14px}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);color:var(--soft);font-size:13px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<div class="gate" id="gate"><div class="box">
  <h2>Casa</h2><p>Quem és?</p>
  <button data-u="Serhii">Serhii</button>
  <button data-u="Violeta">Violeta</button>
</div></div>

<div class="wrap">
<header>
  <h1>Casa</h1><span class="sub" id="sub"></span><span class="sp"></span>
  <span class="who" id="who"></span>
  <button id="swap">trocar</button><button id="exp">↓ notas</button><button id="imp">↑ juntar</button><input id="impf" type="file" accept="application/json" style="display:none"><button id="theme">◐</button>
</header>
<div class="bar">
  <button data-f="all" class="on">Todos</button>
  <button data-f="big">Terreno 3000+</button>
  <button data-f="high">Em altura</button>
  <button data-f="alone">Sem vizinhos</button>
  <button data-f="mine">Com notas</button>
  <button data-f="flag">⚠ Alerta</button><button data-f="rota">🗺 Rota</button><button data-f="mapa">📍 Mapa</button>
  <select id="sort" title="ordenar"><option value="score">Nota &darr;</option><option value="tier">N&iacute;vel &starf; &darr;</option><option value="land">Terreno &darr;</option><option value="price">Pre&ccedil;o &uarr;</option><option value="price_d">Pre&ccedil;o &darr;</option><option value="ppm">&euro;/m&sup2; &uarr;</option><option value="area">&Aacute;rea da casa &darr;</option><option value="rooms">Quartos &darr;</option><option value="wc">Casas de banho &darr;</option><option value="alt">Altitude &darr;</option><option value="alone">Longe de vizinhos &darr;</option></select><input id="q" type="search" placeholder="concelho, agência…">
</div>
<div class="links">
  <a href="frases.html">✍ O que escrever</a>
  <a href="lista.html">🔗 Links por site</a>
</div>
<div id="rota"></div><div id="mapbox"></div><div class="count" id="count"></div>
<div class="grid" id="grid"></div>
<footer id="foot"></footer>
</div>
<div id="toast"></div>

<script>
let HOUSES=[],NOTES={},STATUS={},VISITS={},sortBy=localStorage.getItem('casa_sort')||'score',filt='all',q='',me=localStorage.getItem('casa_user');

const BLOB='019feb59-15e5-7ad0-81ea-0b75e08ca35a';
const API='https://jsonblob.com/api/jsonBlob/'+BLOB;
let DIRTY=new Set(JSON.parse(localStorage.getItem('casa_dirty')||'[]'));
function soil(kind,id){ DIRTY.add(kind+':'+id); saveDirty(); }
function saveDirty(){ localStorage.setItem('casa_dirty',JSON.stringify([...DIRTY])); }
function dirtyHas(kind,id){ return DIRTY.has(kind+':'+id); }

// server value wins, except where we hold something not yet confirmed sent
function mergeMap(serverMap,localMap,kind){
  const out=Object.assign({},serverMap||{});
  Object.keys(localMap||{}).forEach(function(id){
    if(dirtyHas(kind,id)) out[id]=localMap[id];
  });
  Object.keys(out).forEach(function(id){
    if(out[id]==null) delete out[id];
  });
  return out;
}
function mergeNotes(fresh){
  const map=new Map((fresh||[]).map(function(n){return [key(n),n];}));
  let pending=false;
  Object.values(NOTES).flat().forEach(function(n){
    const srv=map.get(key(n));
    const ours=dirtyHas('n',n.house_id)&&n.author===me;
    if(!srv||(ours&&(n.updated_at||'')>=(srv.updated_at||''))){
      map.set(key(n),n);
      if(ours) pending=true;
    }
  });
  const out={};
  [...map.values()].forEach(function(n){(out[n.house_id]=out[n.house_id]||[]).push(n);});
  return {notes:out,pending:pending};
}
let SYNCED=false;

function cacheSave(){
  localStorage.setItem('casa_notes',JSON.stringify(Object.values(NOTES).flat()));
  localStorage.setItem('casa_status',JSON.stringify(STATUS));
  localStorage.setItem('casa_visits',JSON.stringify(VISITS));
}
function cacheLoad(){
  try{
    STATUS=JSON.parse(localStorage.getItem('casa_status')||'{}');
    VISITS=JSON.parse(localStorage.getItem('casa_visits')||'{}');
    return JSON.parse(localStorage.getItem('casa_notes')||'[]');
  }catch(e){ STATUS={}; return []; }
}
function key(n){ return n.house_id+'|'+n.author; }

async function pull(){
  try{
    const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    const d=await r.json();
    SYNCED=true;
    STATUS=mergeMap(d.status,STATUS,'s');
    VISITS=mergeMap(d.visits,VISITS,'v');
    return d.notes||[];
  }catch(e){ SYNCED=false; return cacheLoad(); }
}

// merge my change into whatever is on the server, so we never clobber
// the other person's note
function mark(){
  const el=document.getElementById('sub');
  if(!el||!HOUSES.length) return;
  const c=Object.keys(NOTES).filter(function(k){return (NOTES[k]||[]).length;}).length;
  el.textContent=HOUSES.length+' imóveis · '+c+' com notas · '+
    (SYNCED?'sincronizado':(retryTimer?'por enviar…':'offline'));
}
async function push(mine){
  cacheSave();
  try{
    const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});
    const cur = r.ok ? await r.json() : {notes:[],status:{}};
    const map=new Map((cur.notes||[]).map(n=>[key(n),n]));
    Object.values(NOTES).flat().forEach(n=>{
      const old=map.get(key(n));
      if(!old || n.author===me || (n.updated_at||'')>(old.updated_at||'')) map.set(key(n),n);
    });
    const body={notes:[...map.values()],
                status:Object.assign({},cur.status||{},STATUS),
                visits:Object.assign({},cur.visits||{},VISITS),v:1};
    const w=await fetch(API,{method:'PUT',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(body)});
    if(!w.ok) throw 0;
    SYNCED=true;
    NOTES={}; body.notes.forEach(n=>{(NOTES[n.house_id]=NOTES[n.house_id]||[]).push(n)});
    STATUS=body.status; VISITS=body.visits||{};
    cacheSave();
    DIRTY.clear(); saveDirty();
    return true;
  }catch(e){ SYNCED=false; scheduleRetry(); return false; }
}

// pick up the other person's edits while the page is open
const POLL_MIN=20000, POLL_MAX=150000;
let pollWait=POLL_MIN, pollTimer=null, retryTimer=null;

function scheduleRetry(){
  if(retryTimer) return;                        // one pending retry is enough
  retryTimer=setTimeout(async()=>{ retryTimer=null; await push(); mark(); }, 15000);
}

async function tick(){
  if(!document.hidden){
    const fresh=await pull();
    if(SYNCED){
      pollWait=POLL_MIN;                        // the server is answering again
      const before=JSON.stringify(Object.values(NOTES).flat()
        .map(function(n){return key(n)+'|'+(n.text||'')+'|'+(n.tier||'');}).sort());
      const m=mergeNotes(fresh);
      NOTES=m.notes;
      const after=JSON.stringify(Object.values(NOTES).flat()
        .map(function(n){return key(n)+'|'+(n.text||'')+'|'+(n.tier||'');}).sort());
      if(before!==after){ cacheSave(); render(); }
      if(m.pending||DIRTY.size) scheduleRetry();   // we are ahead of the server
    } else {
      pollWait=Math.min(pollWait*2, POLL_MAX);  // throttled or offline - ease off
    }
    mark();
  }
  pollTimer=setTimeout(tick, pollWait);
}
pollTimer=setTimeout(tick, POLL_MIN);

// coming back to the tab, or back online, is worth an immediate look
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){ clearTimeout(pollTimer); pollWait=POLL_MIN; tick(); }
});
addEventListener('online',function(){ clearTimeout(pollTimer); pollWait=POLL_MIN; tick(); });


const eur=n=>n?new Intl.NumberFormat('pt-PT').format(n)+' €':'—';
const m2=n=>n?new Intl.NumberFormat('pt-PT').format(Math.round(n)):'—';
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function toast(m,bad){const t=document.getElementById('toast');t.textContent=m;
 t.style.background=bad?'#b3261e':'var(--accent)';t.style.opacity='1';
 clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',1500);}

function setUser(u){me=u;localStorage.setItem('casa_user',u);
 document.getElementById('who').textContent=u;
 document.getElementById('gate').style.display='none';}

async function load(){
 HOUSES=await (await fetch('data.json?v='+Date.now())).json();
 const all=await pull();
 NOTES={};all.forEach(n=>{(NOTES[n.house_id]=NOTES[n.house_id]||[]).push(n)});
 mark();
 if(DIRTY.size){ push().then(mark); }
 document.getElementById('foot').innerHTML=
  '«выше округи» — насколько дом выше среднего рельефа в радиусе 15 км. '+
  '«до соседа» — до ближайшей постройки по карте. Notas partilhadas entre Serhii e Violeta.';
 render();
}

function keep(h){
 if(filt==='big'&&!(h.land_area_m2>=3000))return false;
 if(filt==='high'&&!(h.elevation_relative_m>30))return false;
 if(filt==='alone'&&!(h.nearest_building_m>=150))return false;
 if(filt==='mine'&&!(NOTES[h.id]||[]).length)return false;
 if(filt==='flag'&&!h.desc_blockers)return false;
 if(filt==='rota'&&!VISITS[h.id])return false;
 if(filt==='mapa'&&!h.lat)return false;
 if(q){const hay=[h.concelho,h.freguesia,h.district,h.agency_name].filter(Boolean).join(' ').toLowerCase();
  if(!hay.includes(q))return false;}
 return true;
}

function noteBlock(h){
 const list=(NOTES[h.id]||[]);
 const mine=list.find(n=>n.author===me);
 const others=list.filter(n=>n.author!==me);
 return '<div class="notes">'+
  others.map(n=>'<div class="note other"><b>'+n.author+'</b><span class="t">'+
    (n.updated_at||'').slice(5,16).replace('T',' ')+'</span><br>'+esc(n.text)+'</div>').join('')+
  '<div class="tiers"><span style="font-size:12px;color:var(--soft)">nível</span>'+
   [1,2,3].map(t=>'<button data-tier="'+t+'" data-h="'+h.id+'"'+
     (mine&&mine.tier===t?' class="on"':'')+'>'+'★'.repeat(t)+'</button>').join('')+'</div>'+
  '<textarea data-note="'+h.id+'" placeholder="'+(me||'')+': a tua nota…">'+
    esc(mine?mine.text:'')+'</textarea>'+
  '<div class="visit"><span class="vl">visita</span>'+
   '<input type="datetime-local" data-visit="'+h.id+'" value="'+(VISITS[h.id]||'')+'">'+
   (VISITS[h.id]?'<button class="clr" data-clr="'+h.id+'">x</button>':'')+'</div>'+
  '<div class="st">'+['escrito','resposta','visita','top','arquivo']
    .map(s=>'<button data-st="'+s+'" data-h="'+h.id+'"'+((STATUS[h.id]||h.status)===s?' class="on"':'')+'>'+s+'</button>').join('')+
  '</div></div>';
}

function card(h){
 const flags=(h.desc_blockers||'').split(';').map(s=>s.trim()).filter(Boolean);
 const goods=(h.desc_goods||'').split(';').map(s=>s.trim()).filter(Boolean);
 const rooms=(h.desc_rooms||'').split(';').map(s=>s.trim()).filter(Boolean);
 const rel=h.elevation_relative_m;
 const relT=rel==null?'—':(rel>0?'+'+Math.round(rel):Math.round(rel));
 return '<article class="card'+(flags.length?' flag':'')+'">'+
  '<div class="top"><span class="price">'+eur(h.price_eur)+'</span>'+
   (h.auto_score!=null?'<span class="nota'+(h.score_parts<5?' thin':'')+
     '" title="'+h.score_parts+' de 7 critérios conhecidos">'+h.auto_score+'</span>':'')+
   '<span class="ref">#'+h.id+'</span></div>'+
  '<div class="place"><b>'+(h.concelho||'—')+'</b>'+(h.freguesia?' <span>· '+h.freguesia+'</span>':'')+'</div>'+
  '<div class="stats">'+
   '<div class="stat"><div class="v">'+m2(h.land_area_m2)+'</div><div class="k">terreno m²</div></div>'+
   '<div class="stat"><div class="v'+(h.area_m2?'':' dim')+'">'+m2(h.area_m2)+'</div><div class="k">casa m²</div></div>'+
   '<div class="stat"><div class="v'+(h.bedrooms?'':' dim')+'">'+(h.bedrooms?'T'+h.bedrooms:'—')+'</div><div class="k">quartos</div></div>'+
   '<div class="stat"><div class="v'+(h.bathrooms?'':' dim')+'">'+(h.bathrooms||'—')+'</div><div class="k">wc</div></div></div>'+
  '<div class="stats">'+
   '<div class="stat"><div class="v'+(h.elevation_m?'':' dim')+'">'+(h.elevation_m?Math.round(h.elevation_m)+' м':'—')+'</div><div class="k">высота</div></div>'+
   '<div class="stat"><div class="v'+(rel?'':' dim')+'">'+relT+'</div><div class="k">выше округи</div></div>'+
   '<div class="stat"><div class="v'+(h.nearest_building_m?'':' dim')+'">'+(h.nearest_building_m?Math.round(h.nearest_building_m)+' м':'—')+'</div><div class="k">до соседа</div></div>'+
   '<div class="stat"><div class="v'+(h.dist_lisbon_km?'':' dim')+'">'+(h.dist_lisbon_km?Math.round(h.dist_lisbon_km):'—')+'</div><div class="k">км Lisboa</div></div></div>'+
  (flags.length?'<div class="tags">'+flags.map(f=>'<span class="tag bad">⚠ '+f+'</span>').join('')+'</div>':'')+
  (goods.length?'<div class="tags">'+goods.slice(0,6).map(g=>'<span class="tag">'+g+'</span>').join('')+'</div>':'')+
  (rooms.length?'<div class="tags">'+rooms.slice(0,5).map(r=>'<span class="tag rooms">'+r+'</span>').join('')+'</div>':'')+
  (h.excerpt?'<p class="exc">'+esc(h.excerpt)+'</p>':'')+
  '<div class="acts">'+
   (h.agent_phone?'<a class="pri" href="tel:+351'+h.agent_phone+'">Ligar</a>':'')+
   (h.whatsapp?'<a href="'+h.whatsapp+'" target="_blank" rel="noopener">WhatsApp</a>':'')+
   '<a href="'+h.url+'" target="_blank" rel="noopener">Anúncio</a></div>'+
  noteBlock(h)+'</article>';
}


function fmtDay(v){
  var d=new Date(v+'T00:00'); if(isNaN(d)) return v;
  return d.toLocaleDateString('pt-PT',{weekday:'long',day:'2-digit',month:'2-digit'});
}
function fmtTime(v){ return (v||'').slice(11,16); }
function kmBetween(a,b){
  if(!a.lat||!b.lat) return null;
  var R=6371, r=function(x){return x*Math.PI/180;};
  var dp=r(b.lat-a.lat), dl=r(b.lon-a.lon);
  var q=Math.pow(Math.sin(dp/2),2)+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.pow(Math.sin(dl/2),2);
  return 2*R*Math.asin(Math.sqrt(q));
}
function renderRota(){
  var box=document.getElementById('rota');
  var ids=Object.keys(VISITS).filter(function(k){return VISITS[k];});
  if(filt!=='rota'||!ids.length){ box.innerHTML=''; return; }
  var items=ids.map(function(id){
      return {h:HOUSES.filter(function(x){return String(x.id)===String(id);})[0], t:VISITS[id]};
    }).filter(function(x){return x.h;})
      .sort(function(a,b){return a.t.localeCompare(b.t);});
  var days={};
  items.forEach(function(it){ var d=it.t.slice(0,10); (days[d]=days[d]||[]).push(it); });
  var html='';
  Object.keys(days).sort().forEach(function(d){
    var list=days[d];
    var pts=list.filter(function(x){return x.h.lat;})
                .map(function(x){return x.h.lat+','+x.h.lon;});
    var maps=pts.length?'https://www.google.com/maps/dir/'+pts.join('/'):'';
    html+='<div class="day"><div class="dh">'+fmtDay(d)+' &middot; '+list.length+
          ' visita'+(list.length>1?'s':'')+
          (maps?'<a class="mapsbtn" target="_blank" rel="noopener" href="'+maps+'">abrir no Maps</a>':'')+
          '</div>';
    list.forEach(function(it,i){
      var prev=i?list[i-1].h:null;
      var dist=prev?kmBetween(prev,it.h):null;
      var drive=dist!=null?Math.round(dist):null;          // ~60 km/h rural = 1 min per km
      var gap=prev?(new Date(it.t)-new Date(list[i-1].t))/60000:null;
      var tight=(drive!=null&&gap!=null&&gap<drive+30);
      html+='<div class="stop'+(tight?' tight':'')+'">'+
        '<b>'+fmtTime(it.t)+'</b>'+
        '<span class="pl">'+(it.h.concelho||'?')+'</span>'+
        '<span class="pr">'+(it.h.price_eur?new Intl.NumberFormat('pt-PT').format(it.h.price_eur)+' &euro;':'')+'</span>'+
        (it.h.agent_phone?'<a href="tel:+351'+it.h.agent_phone+'">&#9742;</a>':'')+
        (dist!=null?'<div class="leg">'+Math.round(dist)+' km &middot; ~'+drive+' min de carro'+
           (tight?' &mdash; pouco tempo entre visitas':'')+'</div>':'')+
        '</div>';
    });
    html+='</div>';
  });
  box.innerHTML=html;
}


var MAP=null, LAYER=null, LEAFLET=false;
function loadLeaflet(cb){
  if(LEAFLET) return cb();
  var css=document.createElement('link');
  css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(css);
  var js=document.createElement('script');
  js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  js.onload=function(){LEAFLET=true;cb();};
  js.onerror=function(){toast('Mapa nao carregou',true);};
  document.head.appendChild(js);
}
function pinColour(h){
  if(STATUS[h.id]==='top') return '#c25a2b';
  if(VISITS[h.id]) return '#7b3fb5';
  if(h.desc_blockers) return '#b03a3a';
  var t=(NOTES[h.id]||[]).filter(function(n){return n.author===me&&n.tier;})[0];
  if(t&&t.tier>=3) return '#2e6b4f';
  return '#5a7f9c';
}
function renderMapa(list){
  var box=document.getElementById('mapbox');
  if(filt!=='mapa'){ box.classList.remove('on'); return; }
  box.classList.add('on');
  loadLeaflet(function(){
    if(!MAP){
      MAP=L.map(box,{scrollWheelZoom:true}).setView([39.9,-8.4],8);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        {maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(MAP);
    }
    if(LAYER) MAP.removeLayer(LAYER);
    var pts=[];
    LAYER=L.layerGroup(list.filter(function(h){return h.lat;}).map(function(h){
      pts.push([h.lat,h.lon]);
      var m=L.circleMarker([h.lat,h.lon],{radius:8,weight:2,color:'#fff',
        fillColor:pinColour(h),fillOpacity:.95});
      var det=[];
      if(h.bedrooms) det.push('T'+h.bedrooms);
      if(h.land_area_m2) det.push('terreno '+new Intl.NumberFormat('pt-PT').format(h.land_area_m2)+' m²');
      if(h.elevation_m) det.push(Math.round(h.elevation_m)+' m alt.');
      m.bindPopup('<div class="pp"><b>'+(h.concelho||'?')+'</b> &middot; '+eur(h.price_eur)+
        '<div class="m">'+det.join(' &middot; ')+'</div>'+
        (VISITS[h.id]?'<div class="m">visita '+VISITS[h.id].replace('T',' ')+'</div>':'')+
        '<a href="'+h.url+'" target="_blank" rel="noopener">ver anúncio</a>'+
        (h.agent_phone?' &nbsp; <a href="tel:+351'+h.agent_phone+'">ligar</a>':'')+
        ' &nbsp; <a href="https://www.google.com/maps/search/?api=1&query='+h.lat+','+h.lon+
        '" target="_blank" rel="noopener">rota</a></div>');
      return m;
    })).addTo(MAP);
    if(pts.length){ MAP.fitBounds(pts,{padding:[30,30],maxZoom:12}); }
    setTimeout(function(){MAP.invalidateSize();},80);
  });
}


function myTier(h){
  var n=(NOTES[h.id]||[]).filter(function(x){return x.author===me;})[0];
  return n&&n.tier?n.tier:0;
}
var SORTS={
  score : [function(h){return h.auto_score;},        -1],
  tier  : [function(h){return myTier(h)||null;},     -1],
  land  : [function(h){return h.land_area_m2;},      -1],
  price : [function(h){return h.price_eur;},          1],
  price_d:[function(h){return h.price_eur;},         -1],
  ppm   : [function(h){return h.price_per_m2;},       1],
  area  : [function(h){return h.area_m2;},           -1],
  rooms : [function(h){return h.bedrooms;},          -1],
  wc    : [function(h){return h.bathrooms;},         -1],
  alt   : [function(h){return h.elevation_m;},       -1],
  alone : [function(h){return h.nearest_building_m;},-1]
};
function sortList(list){
  var s=SORTS[sortBy]||SORTS.score, get=s[0], dir=s[1];
  return list.slice().sort(function(a,b){
    var x=get(a), y=get(b);
    // anything we do not know goes to the bottom, whichever way we are sorting
    if(x==null&&y==null) return (b.auto_score||0)-(a.auto_score||0);
    if(x==null) return 1;
    if(y==null) return -1;
    if(x===y) return (b.auto_score||0)-(a.auto_score||0);
    return (x-y)*dir;
  });
}

function render(){
 const list=sortList(HOUSES.filter(keep));
 document.getElementById('count').textContent=list.length+' de '+HOUSES.length+' imóveis';
 document.getElementById('grid').innerHTML=(filt==='mapa'?'':list.map(card).join(''));
 renderRota(); renderMapa(list);
}

const persist=cacheSave;
async function saveNote(id,text,tier){
 const prev=(NOTES[id]||[]).find(n=>n.author===me)||{};
 const rest=(NOTES[id]||[]).filter(n=>n.author!==me);
 rest.push({house_id:id,author:me,
   text: text!=='' ? text : (prev.text||''),
   tier: tier!=null ? tier : (prev.tier??null),
   updated_at:new Date().toISOString().slice(0,16).replace('T',' ')});
 NOTES[id]=rest; soil('n',id); render();
 const okd=await push(); mark();
 toast(okd?'Guardado ✓':'Guardado no telemóvel — envio depois',!okd);
}

document.addEventListener('click',async e=>{
 const cl=e.target.closest('[data-clr]');
 if(cl){ delete VISITS[cl.dataset.clr]; soil('v',cl.dataset.clr); await push(); render(); toast('Visita removida'); return; }
 const u=e.target.closest('[data-u]'); if(u){setUser(u.dataset.u);load();return;}
 const f=e.target.closest('[data-f]'); if(f){filt=f.dataset.f;
   document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===f));render();return;}
 if(e.target.id==='theme'){const c=document.documentElement.dataset.theme||
   (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
   document.documentElement.dataset.theme=c==='dark'?'light':'dark';return;}
 if(e.target.id==='swap'){localStorage.removeItem('casa_user');location.reload();return;}
 const t=e.target.closest('[data-tier]');
 if(t){const id=+t.dataset.h;const ta=document.querySelector('[data-note="'+id+'"]');
   await saveNote(id,ta?ta.value:'',+t.dataset.tier);render();return;}
 const s=e.target.closest('[data-st]');
 if(s){const id=+s.dataset.h;
   STATUS[id]=s.dataset.st; soil('s',id); await push();
   const h=HOUSES.find(x=>x.id===id); if(h)h.status=s.dataset.st;
   toast('Estado: '+s.dataset.st); render(); return;}
});

document.addEventListener('change',async e=>{
 const vi=e.target.closest('[data-visit]');
 if(vi){ const id=vi.dataset.visit;
   if(vi.value){ VISITS[id]=vi.value; STATUS[id]='visita'; } else { delete VISITS[id]; }
   soil('v',id); soil('s',id);
   const okd=await push(); render(); mark();
   toast(okd?'Visita marcada':'Guardado no telemóvel',!okd); return; }
 const ta=e.target.closest('[data-note]');
 if(ta)saveNote(+ta.dataset.note,ta.value,null);
});
document.getElementById('sort').addEventListener('change',function(e){
 sortBy=e.target.value; localStorage.setItem('casa_sort',sortBy); render();
});
document.getElementById('sort').value=localStorage.getItem('casa_sort')||'score';
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render();});

if(me){setUser(me);load();}
</script>
<script>
function dl(name,txt){const b=new Blob([txt],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
document.addEventListener('click',e=>{
 if(e.target.id==='exp'){
   dl('casa_notas_'+(me||'x')+'.json',
      JSON.stringify({user:me,notes:Object.values(NOTES).flat(),status:STATUS},null,1));
   toast('Ficheiro guardado');
 }
 if(e.target.id==='imp'){document.getElementById('impf').click();}
});
document.addEventListener('change',async e=>{
 if(e.target.id!=='impf')return;
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{
   const d=JSON.parse(r.result);
   (d.notes||[]).forEach(n=>{
     const l=(NOTES[n.house_id]||[]).filter(x=>x.author!==n.author);
     l.push(n); NOTES[n.house_id]=l;});
   Object.assign(STATUS,d.status||{});
   persist(); render(); toast('Importado ✓');
 }catch(err){toast('Ficheiro inválido',1)}};
 r.readAsText(f);
});
</script></body></html>

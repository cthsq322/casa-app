      if(inWeek&&!stVal(st.id)) todo.push(st);
    });
    if(dropped.length) html+='<div class="pdrop">вне круга: '+
      dropped.map(function(st){ return (st.concelho||'?')+
        (skipWhy(st.id)?' ('+skipWhy(st.id)+')':' (отказ)'); }).join(', ')+
      ' · освободилось '+Math.floor(freed/60)+' ч '+(freed%60)+' мин</div>';
    html+='</div>';
  });
  const head='<div class="planhead">Круг из Лиссабона · <b>'+pl.houses+'</b> домов · '+
    '<b>'+pl.total_drive_h+' ч</b> за рулём'+(pl.by_road?' по дорогам':' по прямой')+
    '<div class="m">В неделю берём дни '+(pl.week||[]).join(', ')+
    ' — <b>'+pl.week_houses+'</b> домов, <b>'+pl.week_drive_h+' ч</b> дороги. '+
    'Ночуем по пути, поэтому первый дом дня без переезда.'+
    (droppedTotal?'<br>Вне круга <b>'+droppedTotal+'</b> домов — освободилось <b>'+
      Math.floor(freedTotal/60)+' ч '+(freedTotal%60)+' мин</b>.':'')+
    '</div></div>';
  html=head+html;
  if(todo.length){
    html='<div class="day todo"><div class="dh">Написать сегодня — '+todo.length+
      ' домов, без них круг не соберётся</div>'+
      todo.map(function(st){ return planStop(st,true); }).join('')+'</div>'+html;
  }
  box.innerHTML=html;
}


function dayKey(off){
  const d=new Date(); d.setDate(d.getDate()+off); d.setHours(0,0,0,0);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function dayTitle(off){
  const d=new Date(); d.setDate(d.getDate()+off);
  const RU=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  return (off===0?'сегодня':off===1?'завтра':RU[d.getDay()])+', '+
    pad2(d.getDate())+'.'+pad2(d.getMonth()+1);
}
let dayOff = 1;                                  // tomorrow by default
let dayFilt='all';
async function renderDay(){
  const box=document.getElementById('dayplan');
  if(!box) return;
  if(filt!=='day'){ box.innerHTML=''; return; }
  const key=dayKey(dayOff);
  const stops=Object.keys(VISITS).map(function(id){
    const t=vTime(id); if(!t||t.slice(0,10)!==key) return null;
    if(outOfLoop(id)) return null;               // выкинутый дом дня не держит
    let h=H_IDX[String(id)];
    if(!h) return null;
    const pp=pinPos(h); if(pp) h=Object.assign({},h,{lat:pp[0],lon:pp[1]});
    return {h:h,t:t,ok:vOk(id),before:vBefore(id),zzz:isZzz(id)};
  }).filter(Boolean);
  // plus the houses we PLAN to ask for this day - slots without a booking
  Object.keys(SLOTS).forEach(function(id){
    const m=SLOTS[id];
    if(typeof m!=='string'||m.slice(0,10)!==key) return;
    if(vTime(id)||outOfLoop(id)) return;
    let h=H_IDX[String(id)];
    if(!h) return;
    const pp=pinPos(h); if(pp) h=Object.assign({},h,{lat:pp[0],lon:pp[1]});
    stops.push({h:h, t:key+'T'+m.slice(11,16), ok:false, planned:true, zzz:isZzz(id)});
  });
  stops.sort(function(a,b){ return a.t.localeCompare(b.t); });
  const asleep=stops.filter(function(x){return x.zzz;});
  const awake=stops.filter(function(x){return !x.zzz;});
  const shown = dayFilt==='ok' ? awake.filter(function(x){return x.ok&&!x.planned;})
    : dayFilt==='plan' ? awake.filter(function(x){return x.planned||!x.ok;})
    : dayFilt==='zzz' ? asleep
    : awake;

  let chips='';
  for(let o=0;o<=6;o++){
    const d=new Date(); d.setDate(d.getDate()+o);
    chips+='<button class="dchip'+(o===dayOff?' on':'')+'" data-dsel="'+o+'">'+
      pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'</button>';
  }
  let html='<div class="dchips">'+chips+'</div>'+
    '<div class="dayhead"><b>'+dayTitle(dayOff)+'</b>'+
    '<span class="dfilt">'+[['all','все'],['ok','✓'],['plan','план'],['zzz','💤']]
      .map(function(x){return '<button data-dfilt="'+x[0]+'"'+
        (dayFilt===x[0]?' class="don"':'')+'>'+x[1]+'</button>';}).join('')+'</span>'+
    '<span class="cnt2">✓'+awake.filter(function(x){return x.ok&&!x.planned;}).length+
      ' · план '+awake.filter(function(x){return x.planned||!x.ok;}).length+
      (asleep.length?' · 💤'+asleep.length:'')+'</span></div>'+
    (function(){
      const pts=shown.filter(function(x){return x.h.lat;})
        .map(function(x){return x.h.lat+','+x.h.lon;});
      if(!pts.length) return '';
      const dest=pts[pts.length-1], way=pts.slice(0,-1).join('|');
      return '<a class="daymaps" target="_blank" rel="noopener" href="'+
        'https://www.google.com/maps/dir/?api=1&destination='+dest+
        (way?'&waypoints='+encodeURIComponent(way):'')+
        '&travelmode=driving">🗺 день в картах — поехали от меня</a>'+
        '<button class="departb" id="departb">⏱ просчитать выезд</button>'+
        '<div class="departbox" id="departbox"></div>';
    })();

  if(!shown.length){
    html+='<div class="dayempty">на этот день ничего не назначено</div>';
  } else {
    await fillRoads(shown);
    let total=0;
    shown.forEach(function(it,i){
      const prev=i?shown[i-1]:null;
      const road=prev?ROADS[roadKey(prev.h,it.h)]:null;
      if(prev){
        const mins=road?Math.round(road.min):null;
        const kms=road?Math.round(road.km):null;
        const gap=(new Date(it.t)-new Date(prev.t))/60000-40;
        if(mins!=null) total+=mins;
        html+='<div class="dleg'+(mins!=null&&gap<mins?' tight':'')+'">'+
          (mins!=null?'&darr; '+kms+' км · '+mins+' мин за рулём':'&darr; дорога')+
          (mins!=null&&gap>mins+20?' · свободно '+Math.round(gap-mins)+' мин':'')+
          (mins!=null&&gap<mins?' · НЕ УСПЕВАЕМ':'')+'</div>';
      }
      const t=bestTier(it.h.id);
      html+='<div class="dstop'+(it.ok?'':' pending')+(it.planned?' planned':'')+'">'+
        '<b>'+it.t.slice(11,16)+'</b>'+

          : it.ok?'':'<span class="warn2">не подтверждён'+
          (it.before?' · ответить до '+it.before.slice(11,16):'')+'</span>')+
        (pinOf(it.h.id)?'<span class="haspin">точка есть</span>'
                :'<span class="warn2">адрес пришлют</span>')+
        '<div class="dacts">'+
          (it.h.agent_phone?'<a href="tel:'+telHref(it.h.agent_phone)+'">позвонить</a>':'')+
          '<a target="_blank" rel="noopener" href="'+
            (pinOf(it.h.id)&&!pinOf(it.h.id).lat?pinOf(it.h.id).url
             :'https://www.google.com/maps/search/?api=1&query='+it.h.lat+','+it.h.lon)+
            '">карта</a>'+
          '<a target="_blank" rel="noopener" href="'+it.h.url+'">объявление</a>'+
          '<a data-goto="'+it.h.id+'">карточка</a>'+
        '</div></div>';
      const fullh=H_IDX[String(it.h.id)];
      if(fullh) html+='<div class="incard">'+card(fullh)+'</div>';
    });
    const mid=shown[Math.floor(shown.length/2)].h;
    const dkey=dayKey(dayOff).replace(/-/g,'');
    html+='<div class="daysum">за рулём между домами <b>'+
      Math.floor(total/60)+' ч '+(total%60)+' мин</b>'+
      (mid&&mid.concelho?' · <a class="hotl" target="_blank" rel="noopener" '+
        'href="https://www.google.com/travel/hotels?q='+
        encodeURIComponent('hoteis baratos perto de '+mid.concelho)+
        '&dates='+dkey+','+dkey+'">🛏 ночлег в районе '+mid.concelho+'</a>':'')+
      '</div>';
  }

  // who was written to and never answered - the same screen, underneath

function feedAllItems(){
  const items=[];
  Object.values(NOTES).flat().forEach(function(n){
    if(!(n.text||'').trim()) return;
    items.push({type:'note',house_id:String(n.house_id),author:n.author||'?',
      text:n.text,at:n.updated_at||'',
      unsent:dirtyHas('n',n.house_id)&&n.author===me});
  });
  Object.values(ENTRIES).flat().forEach(function(n){
    if(!(n.text||'').trim()) return;
    items.push({type:'entry',house_id:String(n.house_id),author:n.author||'?',
      text:n.text,at:n.at||'',
      unsent:dirtyHas('j',n.house_id)&&n.author===me});
  });
  items.sort(function(a,b){return (b.at||'').localeCompare(a.at||'');});
  return items;
}

function ppFmtEur(n){
  if(n==null)return '—';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' €';
}
function ppFmtDate(iso){
  if(!iso)return '—';
  // "2026-08-13T11:12:27+00:00" → "13.08.2026"
  return iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4);
}
function ppEsc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function ppCopyText(btn,text,isStale){
  if(isStale){
    var msg='⚠ Перевод устарел — русский текст менялся після '+
      (btn.dataset.ruUpd?ppFmtDate(btn.dataset.ruUpd):'неизвестной даты')+
      '.\nВсё равно скопировать?';
    if(!confirm(msg))return;
  }
  var out=text||'';
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(out).then(function(){
      btn.textContent='Скопировано';btn.classList.add('copied');
      setTimeout(function(){btn.textContent='Копировать';btn.classList.remove('copied');},1500);
    });
  } else {
    var ta=document.createElement('textarea');ta.value=out;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');document.body.removeChild(ta);
    btn.textContent='Скопировано';btn.classList.add('copied');
    setTimeout(function(){btn.textContent='Копировать';btn.classList.remove('copied');},1500);
  }
}

function ppCopyAll(btn,hid,lang){
  if(!PROPOSTA_DATA)return;
  var house=PROPOSTA_DATA.houses.find(function(h){return h.id===hid;});
  if(!house)return;
  var listing=house.listing||{};
  var fin=house.financibility||{};
  var qVisit=fin.questions_before_visit||[];
  var qs=house.agent_questions||[];
  var sync=house.sync||{};
  var units=sync.units||[];

  var allQUnits=units.filter(function(u){return u.id.indexOf('_qvisit_')>=0||u.id.indexOf('_aq_')>=0;});
  var missingCount=allQUnits.filter(function(u){return !u.pt_hash;}).length;
  var totalQ=qVisit.length+qs.length;

  if(lang==='pt'&&missingCount>0){
    var hasSome=(missingCount<totalQ);
    var msg=hasSome
      ?('⚠ Португальский перевод ещё не готов для '+missingCount+' из '+totalQ+' вопросов.\nСкопировать с русским текстом для непереведённых?')
      :('⚠ Португальский перевод вопросов для этого объекта ещё не готов ('+missingCount+'/'+totalQ+').\nВсё равно скопировать с русским текстом?');
    if(!confirm(msg))return;
  }

  var lines=[];
  lines.push(house.title+' — ref. '+hid);
  if(listing.url) lines.push(listing.url);
  lines.push('');
  if(lang==='pt'){
    lines.push('Bom dia. Estamos a preparar uma proposta formal para este imóvel e precisamos de esclarecer alguns pontos:');
  } else {
    lines.push('Вопросы по объекту:');
  }
  lines.push('');

  var num=1;
  if(qVisit.length){
    lines.push(lang==='pt'?'[Antes da visita]':'[Перед визитом]');
    qVisit.forEach(function(q,i){
      var unit=units.find(function(u){return u.id==='h'+hid+'_qvisit_'+i;});
      var hasPT=unit&&unit.pt_hash;
      lines.push(num+'. '+q+((!hasPT&&lang==='pt')?' [перевод не готов]':''));
      num++;
    });
    lines.push('');
  }
  if(qs.length){
    lines.push(lang==='pt'?'[Questões ao agente]':'[Вопросы агенту]');
    qs.forEach(function(q){
      var unit=units.find(function(u){return u.id==='h'+hid+'_aq_'+q.field;});
      var hasPT=unit&&unit.pt_hash;
      var text=q.how_to_close||q.label;
      lines.push(num+'. '+text+((!hasPT&&lang==='pt')?' [перевод не готов]':''));
      num++;
    });
    lines.push('');
  }
  if(lang==='pt'){
    lines.push('Agradecemos as respostas para podermos avançar.');
  }

  var out=lines.join('\n');
  var origText=btn.textContent;
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(out).then(function(){
      btn.textContent='Скопировано!';
      setTimeout(function(){btn.textContent=origText;},1800);
    });
  } else {
    var ta=document.createElement('textarea');ta.value=out;
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    btn.textContent='Скопировано!';
    setTimeout(function(){btn.textContent=origText;},1800);
  }
}

async function saveNote(id,text,tier,quiet){

 const rest=(NOTES[id]||[]).filter(n=>n.author!==me);
 const t = tier===0 ? null : (tier!=null ? tier : (prev.tier??null));
 const now=new Date().toISOString().slice(0,16).replace('T',' ');

 if(!text && t==null){                // nothing left worth keeping - delete it
   // nothing was there - leave whatever the line already says
   if(!prev.author) return;
   NOTES[id]=rest; soil('n',id);
   if(!quiet) renderCard(id);
   const gone=await push(); mark();
   noteState(id,'idle','заметка удалена');
   toast(gone?'Заметка удалена':'Удалено в телефоне — отправлю позже',!gone);
   return;
 }

 rest.push({house_id:id,author:me,text:text,tier:t,updated_at:now});
 NOTES[id]=rest; soil('n',id); keepPlace();
 if(!quiet) renderCard(id);
 const okd=await push(); mark();
 noteState(id, okd?'ok':'wait',
   okd?'сохранено '+now.slice(11):'не отправлено — сохранено в телефоне');
 if(!quiet) toast(okd?'Сохранено ✓':'Сохранено в телефоне — отправлю позже',!okd);
}

});
